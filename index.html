<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="mobile-web-app-capable"
content="yes">

<title>AK Visitor Pass</title>

<!-- BOOTSTRAP -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- STYLE -->

<link rel="stylesheet"
href="style.css">

<style>

/* =========================
   BODY
========================= */

body{

background:url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=1600');

background-size:cover;

background-position:center;

background-repeat:no-repeat;

min-height:100vh;

font-family:Arial,sans-serif;

}

/* =========================
   OVERLAY
========================= */

.overlay{

background:rgba(0,0,0,0.6);

min-height:100vh;

padding-bottom:40px;

}

/* =========================
   NAVBAR
========================= */

.navbar{

box-shadow:0 4px 15px rgba(0,0,0,0.3);

}

/* =========================
   LOGO
========================= */

.navbar-brand img{

transition:0.3s;

}

.navbar-brand img:hover{

transform:scale(1.08);

}

/* =========================
   CARD
========================= */

.animate-card{

background:rgba(255,255,255,0.95);

backdrop-filter:blur(10px);

transition:0.4s;

border-radius:20px;

}

.animate-card:hover{

transform:translateY(-5px);

box-shadow:0 15px 35px rgba(0,0,0,0.3);

}

/* =========================
   INPUT
========================= */

.form-control{

height:50px;

border-radius:12px;

font-size:16px;

}

/* =========================
   BUTTON
========================= */

.btn{

height:50px;

border-radius:12px;

font-weight:bold;

font-size:16px;

}

/* =========================
   CAMERA
========================= */

#camera{

display:none;

height:300px;

background:black;

object-fit:cover;

border-radius:15px;

}

/* =========================
   PREVIEW
========================= */

#preview{

display:none;

width:150px;

height:150px;

border-radius:15px;

object-fit:cover;

margin-bottom:20px;

border:3px solid #0d6efd;

box-shadow:0 4px 15px rgba(0,0,0,0.3);

}

/* =========================
   CONTACT
========================= */

.contact-box{

background:#f8f9fa;

padding:20px;

border-radius:15px;

}

/* =========================
   BELL
========================= */

.badge{

font-size:12px;

}

</style>

</head>

<body>

<div class="overlay">

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-dark navbar-expand-lg">

<div class="container">

<!-- LOGO -->

<a
class="navbar-brand d-flex align-items-center"
href="index.html">

<div style="
width:75px;
height:75px;
background:white;
border-radius:18px;
padding:6px;
display:flex;
align-items:center;
justify-content:center;
margin-right:14px;
box-shadow:0 6px 18px rgba(0,0,0,0.35);
border:3px solid #0d6efd;
overflow:hidden;
">

<img
src="images/logo.png"
alt="Company Logo"
style="
width:100%;
height:100%;
object-fit:contain;
border-radius:12px;">

</div>
<div>

<h3 style="
margin:0;
font-weight:bold;
color:white;
">

AK Visitor Pass

</h3>

<small style="
color:#cfd8dc;
font-size:12px;
letter-spacing:2px;
">

SMART SECURITY SYSTEM

</small>

</div>

</a>

<!-- MENU -->

<ul class="navbar-nav ms-auto d-flex flex-row align-items-center">

<li class="nav-item mx-3">

<a class="nav-link text-white"
href="index.html">

Home

</a>

</li>

<li class="nav-item mx-3">

<a class="nav-link text-white"
href="visitors.html">

Visitors

</a>

</li>

<li class="nav-item mx-3 position-relative">

<a class="nav-link text-white"
href="visitors.html">

🔔

<span
id="bellCount"
class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

0

</span>

</a>

</li>

</ul>

</div>

</nav>

<!-- =========================
     FORM
========================= -->

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg p-4 border-0 animate-card">

<h1 class="text-center mb-4 fw-bold">

Visitor Registration

</h1>

<form id="visitorForm">

<!-- NAME -->

<input
type="text"
id="name"
class="form-control mb-3"
placeholder="Visitor Name"
required>

<!-- EMAIL -->

<input
type="email"
id="email"
class="form-control mb-3"
placeholder="Visitor Email"
required>

<!-- PURPOSE -->

<input
type="text"
id="purpose"
class="form-control mb-3"
placeholder="Purpose"
required>

<!-- OPEN CAMERA -->

<button
type="button"
id="openCameraBtn"
class="btn btn-dark w-100 mb-3">

📷 Open Camera

</button>

<!-- CAMERA -->

<video
id="camera"
autoplay
class="w-100 mb-3">
</video>

<!-- TAKE PHOTO -->

<button
type="button"
id="captureBtn"
class="btn btn-warning w-100 mb-3"
style="display:none;">

📸 Take Photo

</button>

<!-- CANVAS -->

<canvas
id="canvas"
style="display:none;">
</canvas>

<!-- PREVIEW -->

<div class="text-center">

<img
id="preview">

</div>

<!-- SUBMIT -->

<button
type="submit"
class="btn btn-primary w-100 mb-4">

Submit

</button>

</form>

<!-- CONTACT -->

<div class="contact-box text-center">

<h5 class="fw-bold mb-3">

Contact Details

</h5>

<p class="mb-2">

📧 visitor26@gmail.com

</p>

<p class="mb-2">

📞 +91 9876543210

</p>

<p class="mb-0">

📍 Chennai, Tamil Nadu

</p>

</div>

</div>

</div>

</div>

</div>

</div>

<!-- =========================
     AUDIO
========================= -->

<audio id="notifySound">

<source
src="notify.mp3"
type="audio/mpeg">

</audio>

<!-- =========================
     EMAILJS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<!-- =========================
     SCRIPT
========================= -->

<script src="script.js"></script>

</body>

</html>
