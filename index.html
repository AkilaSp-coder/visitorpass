<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Visitor Pass</title>

<!-- BOOTSTRAP -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- STYLE -->

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark navbar-expand-lg">

<div class="container">

<a class="navbar-brand fw-bold"
href="index.html">

Visitor Pass

</a>

<ul class="navbar-nav ms-auto d-flex flex-row align-items-center">

<li class="nav-item mx-3">

<a class="nav-link text-white"
href="index.html">

Home

</a>

</li>

<li class="nav-item mx-3">

<a class="nav-link text-white"
href="visitors.html">

Visitors

</a>

</li>

<li class="nav-item mx-3 position-relative">

<a class="nav-link text-white"
href="visitors.html">

🔔

<span
id="bellCount"
class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

0

</span>

</a>

</li>

</ul>

</div>

</nav>

<!-- FORM -->

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow p-4 border-0 rounded-4">

<h1 class="text-center mb-4 fw-bold">

Visitor Registration

</h1>

<form id="visitorForm">

<!-- NAME -->

<input
type="text"
id="name"
class="form-control mb-3"
placeholder="Visitor Name"
required>

<!-- EMAIL -->

<input
type="email"
id="email"
class="form-control mb-3"
placeholder="Visitor Email"
required>

<!-- PURPOSE -->

<input
type="text"
id="purpose"
class="form-control mb-3"
placeholder="Purpose"
required>

<!-- OPEN CAMERA BUTTON -->

<button
type="button"
id="openCameraBtn"
class="btn btn-dark w-100 mb-3">

📷 Open Camera

</button>

<!-- CAMERA -->

<video
id="camera"
autoplay
class="w-100 rounded-3 mb-3"
style="
display:none;
height:300px;
background:black;
object-fit:cover;">
</video>

<!-- TAKE PHOTO BUTTON -->

<button
type="button"
id="captureBtn"
class="btn btn-warning w-100 mb-3"
style="display:none;">

📸 Take Photo

</button>

<!-- CANVAS -->

<canvas
id="canvas"
style="display:none;">
</canvas>

<!-- PREVIEW -->

<div class="text-center">

<img
id="preview"
width="150"
height="150"
style="
display:none;
border-radius:12px;
object-fit:cover;
margin-bottom:20px;
border:3px solid #0d6efd;">

</div>

<!-- SUBMIT -->

<button
class="btn btn-primary w-100">

Submit

</button>

</form>

</div>

</div>

</div>

</div>

<!-- AUDIO -->

<audio id="notifySound">

<source
src="notify.mp3"
type="audio/mpeg">

</audio>

<!-- EMAILJS -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<!-- SCRIPT -->

<script src="script.js"></script>

</body>

</html>
