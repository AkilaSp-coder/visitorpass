<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Visitors List</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background:#f4f4f4;

font-family:Arial,sans-serif;

}

.container{

margin-top:50px;

}

table{

background:white;

}

</style>

</head>

<body>

<div class="container">

<h1 class="text-center mb-5">

Visitors List

</h1>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Purpose</th>
<th>Status</th>

</tr>

</thead>

<tbody id="visitorTable">

</tbody>

</table>

</div>

<script>

/* GET VISITORS */

let visitors =
JSON.parse(localStorage.getItem("visitors"))
|| [];

/* TABLE */

let table =
document.getElementById("visitorTable");

/* CHECK DATA */

if(visitors.length === 0){

table.innerHTML = `

<tr>

<td colspan="5"
class="text-center text-danger">

No Visitors Found

</td>

</tr>

`;

}

/* SHOW DATA */

else{

visitors.forEach(function(visitor){

table.innerHTML += `

<tr>

<td>${visitor.id}</td>

<td>${visitor.name}</td>

<td>${visitor.email}</td>

<td>${visitor.purpose}</td>

<td>${visitor.status}</td>

</tr>

`;

});

}

</script>

</body>

</html>
